<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="halaman-login" data-halaman="login">
  <main class="kartu-login">
    <h1>Selamat Datang</h1>
    <form id="formLogin" novalidate>
      <label class="field"><span aria-hidden="true"></span>
        <input type="email" id="email" placeholder="Email" autocomplete="username"></label>
      <label class="field"><span aria-hidden="true"></span>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password"></label>
      <p class="kanan-teks"><button type="button" class="tautan" data-buka="modalLupa">Lupa password ?</button></p>
      <button type="submit" class="btn">Masuk</button>
    </form>
    <p class="tengah"><button type="button" class="tautan" data-buka="modalDaftar">Belum punya akun?</button></p>
  </main>

  <div class="modal" id="modalLupa" role="dialog" aria-modal="true" aria-labelledby="jLupa">
    <form class="modal-isi" id="formLupa" novalidate>
      <h2 id="jLupa">Lupa Password</h2>
      <label>Email terdaftar<input type="email" id="emailLupa"></label>
      <button type="submit" class="btn">Kirim tautan reset</button>
      <button type="button" class="tautan" data-tutup>Batal</button>
    </form>
  </div>

  <div class="modal" id="modalDaftar" role="dialog" aria-modal="true" aria-labelledby="jDaftar">
    <form class="modal-isi" id="formDaftar" novalidate>
      <h2 id="jDaftar">Daftar Akun</h2>
      <label>Nama lengkap<input type="text" id="namaDaftar"></label>
      <label>Email<input type="email" id="emailDaftar"></label>
      <label>Password (min. 6 karakter)<input type="password" id="passDaftar"></label>
      <label>Peran<select id="roleDaftar"><option>UPBJJ-UT</option><option>Puslaba</option><option>Fakultas</option></select></label>
      <label>Lokasi (mis. UPBJJ Jakarta)<input type="text" id="lokasiDaftar"></label>
      <button type="submit" class="btn">Daftar</button>
      <button type="button" class="tautan" data-tutup>Batal</button>
    </form>
  </div>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
